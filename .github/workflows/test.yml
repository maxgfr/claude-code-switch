name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SC3043 (`local` in POSIX sh) is a documented convention — see CLAUDE.md
      - name: Shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -s sh -e SC3043 ccs test.sh

      - name: Run test suite
        run: ./test.sh

  keepawake:
    name: Keep awake (real systemd-inhibit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # test.sh stubs the keep-awake tool, which proves the flags ccs passes but
      # not that systemd accepts them. This runs the real thing and requires the
      # inhibitor lock to actually exist while the wrapped process is alive.
      - name: ccs --caffeine takes a real inhibitor lock
        run: |
          set -eu
          command -v systemd-inhibit

          # The runner process is in no logind session and the image ships no
          # polkit, so logind denies inhibitor locks to the `runner` user
          # ("Failed to inhibit: Access denied"). Root is allowed, hence sudo.
          # Probe first, so a runner limitation can never read as a ccs pass.
          if ! sudo systemd-inhibit --what=sleep --who=probe --why=probe --mode=block true; then
              echo "::notice::this runner cannot take an inhibitor lock — ccs not exercised"
              exit 0
          fi

          CCS_HOME=$(mktemp -d)
          SHIM=$(mktemp -d)
          printf '#!/bin/sh\nsystemd-inhibit --list\n' > "$SHIM/claude"
          chmod +x "$SHIM/claude"

          # sudo resets HOME and PATH, so both are handed over explicitly
          run() { sudo env "HOME=$CCS_HOME" "PATH=$SHIM:$PATH" ./ccs "$@"; }

          run help >/dev/null
          sudo sed -i 's/^api_key=$/api_key=sk-ant-test/' "$CCS_HOME/.claude-provider/config"
          run use anthropic >/dev/null

          # The lock ccs holds, as systemd reports it while claude is running
          lock() { run "$1" 2>&1 | grep 'ccs' || true; }

          echo "--- system mode: blocks sleep, leaves idle alone ---"
          sys=$(lock --caffeine); echo "${sys:-<none>}"
          case "$sys" in
              *sleep:idle*) echo "FAIL: system mode should not inhibit idle"; exit 1 ;;
              *sleep*)      echo "ok" ;;
              *)            echo "FAIL: no ccs inhibitor lock while claude ran"; exit 1 ;;
          esac

          echo "--- display mode: blocks idle too ---"
          disp=$(lock --caffeine=display); echo "${disp:-<none>}"
          case "$disp" in
              *sleep:idle*) echo "ok" ;;
              *)            echo "FAIL: display mode did not inhibit idle"; exit 1 ;;
          esac

          echo "--- and the lock is gone once the session ends ---"
          if sudo systemd-inhibit --list | grep -q 'ccs'; then
              echo "FAIL: an inhibitor lock outlived the session"
              exit 1
          fi
          echo "OK"
